[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space-aiagent"
version = "0.1.0"
description = "航天分析平台智能助手 - 基于 DeepAgent 的多 Agent 系统"
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    # Web 框架
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "websockets>=14.0,<16",

    # Agent 框架
    "deepagents>=0.6.8",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",

    # 数据库
    "aiosqlite>=0.22.1",

    # 配置与数据
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "orjson>=3.11.9",

    # 日志
    "structlog>=25.5.0",

    # 可观测性（OTel + Langfuse v3）
    # enabled=false 时全链路 NoOp，业务零依赖；enabled=true 时需要可访问的 Langfuse 实例
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b.0",
    "langfuse>=3.0,<4.0",

    # 工具
    "rich>=15.0.0",
    "click>=8.4.1",

    # 失败恢复（重试退避引擎）
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
space-aiagent = "space_aiagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
space_aiagent = ["prompts/*.md"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
