workers:
  - name: scene-agent
    description: >-
      处理场景本身的单步骤操作：创建、打开、删除、查询、修改场景。
      用户明确要打开场景，或“打开”的对象名称本身以“场景”结尾时归此 Worker，
      例如“打开火箭测试场景”。不处理在当前场景内打开或展示数据分析结果。
    tools:
      - scene_management
    skills:
      - /skills/scene/
    interrupt_on:
      delete_scene:
        allowed_decisions: ["approve", "reject"]
        description: "即将删除当前场景，场景内所有实体将一并清除且不可撤销，请确认是否继续。"
      rename_scenario:
        allowed_decisions: ["approve", "reject"]
        description: "即将重命名当前场景，请确认是否继续。"
    prompt_file: scene_agent.md

  - name: entity-agent
    description: 处理实体和轨道相关单步骤操作：添加、查询、统计、按名称删除或清空实体，创建和更新 SGP4 轨道。
    tools:
      - entity_management
      - orbit_management
    skills:
      - /skills/entity/
    interrupt_on:
      delete_entities:
        # 中断文案按 entity_name 动态生成（见 tools.py delete_entities_interrupt_description）
        allowed_decisions: ["approve", "reject"]
    prompt_file: entity_agent.md

  - name: analysis-agent
    description: >-
      处理当前场景内的数据分析与分析结果展示：查询分析项，打开、展示、显示或隐藏
      数据报表、图表及分析结果。例如“在场景内打开光照数据分析结果”归此 Worker，
      不得将“光照数据分析结果”改写成场景名。
    tools:
      - analysis_management
    skills:
      - /skills/analysis/
    prompt_file: analysis_agent.md
