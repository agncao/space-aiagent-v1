# AgentResponse 模板与状态映射（单一数据源）
#
# 每个 code 同时定义:
# - template: 渲染模板（{key} 占位符从 AgentResponse.args 取值）
#
# 加载入口: space_aiagent.bridge.response_renderer._load_template_config()
# 修改本文件后无需重启 Python 进程之外的操作（import 时读取一次）。

NO_SCENE:
  template: |-
    还没有打开的场景。你需要先打开场景，或者你也可以创建新的场景，这样你才能进行航天任务分析。

    **接下来您可以：**
    - **创建场景** — 告诉我「创建场景」或「新建一个场景」，我会帮您处理
    - 场景创建后，即可添加卫星（基于 TLE）、地面站、传感器等实体

    请问需要先创建一个场景吗？

TASK_LOOP_GUARD:
  template: |-
    我还缺少继续处理所需的关键信息，暂时不能直接执行下一步。

    请补充更具体的内容，例如：
    - 要操作的实体或场景名称
    - 想修改的目标属性
    - 是否确认执行当前操作

    请直接告诉我要补充的关键信息，我会继续处理。

SCENE_CREATED:
  template: |-
    场景 **「{scene_name}」** 已创建成功！

    现在可以在此场景中添加实体了。

    **接下来您可以：**
    - 添加卫星 — 提供 TLE 两行根数，我会帮您创建轨道
    - 添加地面站、传感器等实体 — 告诉我类型和位置即可

ENTITIES_EMPTY:
  template: |-
    当前场景 **「{scene_name}」** 中没有任何实体。

    **接下来您可以：**
    - 添加卫星（提供 TLE 两行根数）
    - 添加地面站、传感器等实体
    请告诉我您需要添加什么类型的实体。

ENTITY_CREATED:
  template: |-
    实体 **「{name}」**（类型: {entity_type}）已成功添加到场景 **{scene_name}** 中。

ENTITIES_CLEARED:
  template: |-
    已清除场景中所有的实体。当前场景为空，可以重新创建实体。

OUT_OF_SCOPE:
  template: |-
    抱歉，当前版本暂不支持「{capability}」相关操作。

    **您可以尝试以下我能做的事：**
    - 创建/重命名/删除场景
    - 添加卫星（基于 TLE）、地面站、传感器、地面车等实体
    - 查询场景及其包含的实体

    请问需要我帮您做哪一项？
