agents:
  - name: scene-agent
    description: 处理场景相关操作：创建、打开、删除、查询、修改场景。
    tools:
      - scene_management
    prompt_file: scene_agent.md

  - name: entity-agent
    description: 处理实体和轨道相关操作：添加实体，创建和更新SGP4轨道。当用户提到添加实体、创建轨道、TLE时使用此 Agent。
    tools:
      - entity_management
      - orbit_management
    prompt_file: entity_agent.md
