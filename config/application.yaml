application:
  name: space-aiagent
  version: 2.0.0
  description: "航天分析平台智能助手"

server:
  host: "0.0.0.0"
  port: 8028
  workers: 1
  cors_origins:
    - "*"

logging:
  level: INFO
  format: json
  console: true
  file:
    enabled: true
    dir: ./logs
    max_bytes: 10485760    # 10MB
    backup_count: 10
    rotation: true

worker_model:
  temperature: 0
  streaming: true
  enable_thinking: false

workflow:
  enabled: true
  database_path: data/workflow.db

flash_model:
  temperature: 0.1
  streaming: true
  enable_thinking: false

observability:
  # 总开关：false 时全链路 NoOp，业务零开销、零依赖
  enabled: false
  service_name: space-aiagent
  # Langfuse v3 后端 OTLP 端点
  langfuse_endpoint: http://localhost:3000/api/public/otel
  # 凭证从 .env 注入（LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY）
  sampler_ratio: 1.0
  # Span 批处理调优用环境变量：LANGFUSE_FLUSH_AT / LANGFUSE_FLUSH_INTERVAL

retry:
  # 失败恢复（Phase 1B）：false 时 RetryMiddleware 透传，零开销
  # 与 observability.enabled 独立
  enabled: true
  llm:
    max_attempts: 3
    base_delay: 1.0
    max_delay: 10.0
    # ToolStrategy 结构化输出解析失败是否重试，默认 false
    retry_on_parse_error: false
  tool:
    max_attempts: 3
    base_delay: 1.0
    max_delay: 10.0
